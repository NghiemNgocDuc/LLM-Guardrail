# /etc/fail2ban/jail.d/guardrails.conf
# Copy to your Docker host to protect the exposed port.

[guardrails-web]
enabled  = true
port     = 8080
filter   = guardrails-login
logpath  = /var/log/nginx/access.log
maxretry = 5
findtime = 300
bantime  = 3600
action   = iptables-allports[name=guardrails]

[DEFAULT]
# Ban any IP that triggers 5+ auth failures in 5 minutes
ignoreip = 127.0.0.1/8 ::1
