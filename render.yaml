services:
  - type: web
    name: llm-guardrails
    env: docker
    dockerfilePath: ./Dockerfile.fullstack
    build:
      args:
        VITE_API_BASE_URL: ""
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_POSTHOG_API_KEY: ${VITE_POSTHOG_API_KEY}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    envVars:
      # ── App ──────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: https://llm-guardrails.onrender.com
      - key: PUBLIC_APP_URL
        value: https://llm-guardrails.onrender.com
      - key: PORT
        value: "8000"
      # ── Secrets (set in Render Dashboard) ────────────────────────────────
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_REDIS_URL
        sync: false
      # ── Supabase / PostgreSQL ────────────────────────────────────────────
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "6543"
      # ── Vector store (Pinecone) ──────────────────────────────────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: PINECONE_INDEX_NAME
        value: guardrails
      # ── Auth (Clerk) ─────────────────────────────────────────────────────
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: CLERK_JWT_KEY
        sync: false
      # ── LLM providers ────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DEFAULT_LLM_BACKEND
        value: anthropic
      - key: DEFAULT_MODEL
        value: claude-sonnet-4-20250514
      # ── Billing (Stripe) ─────────────────────────────────────────────────
      - key: BILLING_ENABLED
        value: "true"
      - key: FREE_SIGNUP_TOKENS
        value: "10000"
      - key: BILLING_UNLIMITED_EMAILS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── Frontend VITE_ vars (also needed as Docker build args above) ────
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: VITE_POSTHOG_API_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        value: https://us.i.posthog.com
      - key: VITE_SENTRY_DSN
        sync: false
