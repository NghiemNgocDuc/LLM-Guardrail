name: Scan agent skills

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - ".cursor/skills/**"
      - "guardrails/**"
      - "scripts/scan_agent_skills.py"
      - "scripts/install-git-hooks.*"
      - ".githooks/**"
      - "cli/guardrail-scan/**"
      - "fixtures/**"
      - ".github/workflows/scan-agent-skills.yml"

permissions:
  contents: read

jobs:
  skill-guard:
    name: Skill Guard (.cursor/skills)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install canonical scanner dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan committed skill files
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-skill-scan-not-for-production
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/scan_agent_skills.py --github-actions --git-range "$PR_BASE..$AFTER"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/scan_agent_skills.py --github-actions --git-range "$AFTER"
          else
            python scripts/scan_agent_skills.py --github-actions --git-range "$BEFORE..$AFTER"
          fi
