name: Scan agent skills

on:
  pull_request:
    branches: [main]
  push:
    paths:
      - ".cursor/skills/**"
      - "guardrails/**"
      - "scripts/scan_agent_skills.py"
      - "scripts/install-git-hooks.*"
      - ".githooks/**"
      - "cli/guardrail-scan/**"
      - "fixtures/**"
      - ".github/workflows/scan-agent-skills.yml"

permissions:
  contents: read

jobs:
  skill-guard:
    name: Skill Guard (.cursor/skills)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build guardrail-scan
        run: make build
        working-directory: cli/guardrail-scan

      - name: Scan skill files in this push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          SCAN="cli/guardrail-scan/guardrail-scan"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$SCAN" --github-actions
            exit $?
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "First push or empty before SHA — scanning all skills"
            "$SCAN" --github-actions
            exit $?
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- '.cursor/skills/' || true)
          if [ -z "$CHANGED" ]; then
            echo "Skill Guard: no .cursor/skills/ changes in this push."
            exit 0
          fi
          echo "Skill Guard: scanning changed skill files:"
          echo "$CHANGED"
          "$SCAN" --github-actions $CHANGED
