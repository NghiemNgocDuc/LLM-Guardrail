name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan for common secret patterns
        shell: python
        run: |
          import pathlib
          import re
          import sys

          patterns = [
              re.compile("g" + "sk_"),
              re.compile("sk-" + r"[A-Za-z0-9]"),
              re.compile("AI" + "za"),
              re.compile("gh" + "p_"),
              re.compile("github" + "_pat_"),
              re.compile("xox" + r"[baprs]-"),
              re.compile("AK" + r"IA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----"),
              re.compile("SECRET" + r"_KEY\s*=\s*[^<\s].{16,}"),
              re.compile("GROQ" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("OPENAI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("ANTHROPIC" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("GEMINI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("POSTGRES" + r"_PASSWORD\s*=\s*(postgres|[^<\s].{8,})"),
              re.compile(r"postgresql\+asyncpg://[^:]+:[^<@]+@"),
          ]
          excluded_dirs = {".git", "node_modules", "dist", "__pycache__"}
          excluded_files = {".env.example", "package-lock.json"}
          # Files that legitimately reference key patterns in code, not actual secrets
          excluded_paths = {
              "app/config.py",
              "app/deps.py",
              "tests/test_api_key_auth.py",
              "tests/test_groq_backend.py",
              "guardrails/input.py",
              ".github/workflows/ci.yml",
              # Intentional test fixtures with fake keys
              "fixtures/skills/multi-finding-skill.md",
              "fixtures/skills/gateway-key-skill.md",
          }
          hits = []

          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.name in excluded_files:
                  continue
              if path.as_posix() in excluded_paths or str(path).replace("\\", "/") in excluded_paths:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_no}: potential secret pattern")

          if hits:
              print("\n".join(hits))
              print("Potential secret detected. Remove the value before committing.")
              sys.exit(1)

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest -q

  go-port-tests:
    name: Go port tests (guardrail-scan)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests (includes Python parity check)
        run: go test ./...
        working-directory: cli/guardrail-scan

  rust-engine-tests:
    name: Rust engine tests (guardrail_core)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: guardrail_core

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Rust unit tests
        run: cargo test --release
        working-directory: guardrail_core

      - name: Build wheel and install
        run: |
          maturin build --release --interpreter python --out wheels
          pip install wheels/*.whl

      - name: Run engine-parity tests (rust + python)
        env:
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest tests/test_guardrails.py tests/test_skill_guardrails.py tests/test_skill_guardrails_fixtures.py tests/test_skill_overrides.py tests/test_dangerous_commands.py tests/test_scan_agent_skills_cli.py tests/test_mcp_tools.py tests/test_guardrail_reasons.py -q

  golden-tests:
    name: Golden verdict tests
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build wheel and install
        run: |
          maturin build --release --interpreter python --out wheels
          pip install wheels/*.whl

      - name: Run golden harness (both engines)
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest tests/test_golden.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: python -m pip_audit -r requirements.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - dependency-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t llm-guardrail-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t llm-guardrail-web:ci .

      - name: Build fullstack image
        run: docker build -f Dockerfile.fullstack -t llm-guardrail-fullstack:ci .

      - name: Scan Dockerfile and filesystem with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:latest fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            /workspace
