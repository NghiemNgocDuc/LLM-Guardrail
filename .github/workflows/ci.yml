name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan tracked files for credential patterns
        run: python scripts/check_repository_secrets.py

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python application and maintenance code
        run: python -m ruff check app guardrails main.py seed.py grpc_gateway/server.py sdk/python examples scripts

      - name: Run tests
        env:
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest -q

  go-port-tests:
    name: Go port tests (guardrail-scan)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests (includes Python parity check)
        run: go test ./...
        working-directory: cli/guardrail-scan

  rust-engine-tests:
    name: Rust engine tests (guardrail_core)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: guardrail_core

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Rust unit tests
        run: cargo test --release
        working-directory: guardrail_core

      - name: Build wheel and install
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release --interpreter python --out wheels
          pip install wheels/*.whl

      - name: Run engine-parity tests (rust + python)
        env:
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest tests/test_guardrails.py tests/test_skill_guardrails.py tests/test_skill_guardrails_fixtures.py tests/test_skill_overrides.py tests/test_dangerous_commands.py tests/test_scan_agent_skills_cli.py tests/test_mcp_tools.py tests/test_guardrail_reasons.py -q

  golden-tests:
    name: Golden verdict tests
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build wheel and install
        run: |
          python -m pip install 'maturin>=1.7,<2'
          maturin build --release --interpreter python --out wheels
          pip install wheels/*.whl

      - name: Run golden harness (both engines)
        env:
          APP_ENV: development
          SECRET_KEY: test-secret-not-for-production
        run: python -m pytest tests/test_golden.py -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install frontend test browser
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile frontend
        run: npm run test:frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: python -m pip_audit -r requirements.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - dependency-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build API image
        run: docker build -t llm-guardrail-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t llm-guardrail-web:ci .

      - name: Build fullstack image
        run: docker build -f Dockerfile.fullstack -t llm-guardrail-fullstack:ci .

      - name: Scan Dockerfile and filesystem with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:latest fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            /workspace
