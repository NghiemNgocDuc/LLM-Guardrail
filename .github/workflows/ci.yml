name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Scan for common secret patterns
        shell: python
        run: |
          import pathlib
          import re
          import sys

          patterns = [
              re.compile("g" + "sk_"),
              re.compile("sk-" + r"[A-Za-z0-9]"),
              re.compile("AI" + "za"),
              re.compile("gh" + "p_"),
              re.compile("github" + "_pat_"),
              re.compile("xox" + r"[baprs]-"),
              re.compile("AK" + r"IA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----"),
              re.compile("SECRET" + r"_KEY\s*=\s*[^<\s].{16,}"),
              re.compile("GROQ" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("OPENAI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("ANTHROPIC" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("GEMINI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("POSTGRES" + r"_PASSWORD\s*=\s*(postgres|[^<\s].{8,})"),
              re.compile(r"postgresql\+asyncpg://[^:]+:[^<@]+@"),
          ]
          excluded_dirs = {".git", "node_modules", "dist", "__pycache__"}
          excluded_files = {".env.example", "package-lock.json"}
          hits = []

          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.name in excluded_files:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_no}: potential secret pattern")

          if hits:
              print("\n".join(hits))
              print("Potential secret detected. Remove the value before committing.")
              sys.exit(1)

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Show Python version
        run: python3 --version

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          APP_ENV: development
          DATABASE_URL: ""
          SECRET_KEY: test-secret-not-for-production
        run: python3 -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Show Node version
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Install pip-audit
        run: python3 -m pip install pip-audit

      - name: Run pip-audit
        run: python3 -m pip_audit -r requirements.txt

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
      - dependency-scan
    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: bearer $GITHUB_TOKEN" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Build API image
        run: docker build -t llm-guardrail-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t llm-guardrail-web:ci .

      - name: Build fullstack image
        run: docker build -f Dockerfile.fullstack -t llm-guardrail-fullstack:ci .

      - name: Scan Dockerfile and filesystem with Trivy
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:latest fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            /workspace
