name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for common secret patterns
        shell: python
        run: |
          import pathlib
          import re
          import sys

          patterns = [
              re.compile("g" + "sk_"),
              re.compile("sk-" + r"[A-Za-z0-9]"),
              re.compile("AI" + "za"),
              re.compile("gh" + "p_"),
              re.compile("github" + "_pat_"),
              re.compile("xox" + r"[baprs]-"),
              re.compile("AK" + r"IA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN (RSA|OPENSSH|EC|DSA|PRIVATE) KEY-----"),
              re.compile("SECRET" + r"_KEY\s*=\s*[^<\s].{16,}"),
              re.compile("GROQ" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("OPENAI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("ANTHROPIC" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("GEMINI" + r"_API_KEY\s*=\s*[^<\s]+"),
              re.compile("POSTGRES" + r"_PASSWORD\s*=\s*(postgres|[^<\s].{8,})"),
              re.compile(r"postgresql\+asyncpg://[^:]+:[^<@]+@"),
          ]
          excluded_dirs = {".git", "node_modules", "dist", "__pycache__"}
          excluded_files = {".env.example", "package-lock.json"}
          hits = []

          for path in pathlib.Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.name in excluded_files:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_no}: potential secret pattern")

          if hits:
              print("\n".join(hits))
              print("Potential secret detected. Remove the value before committing.")
              sys.exit(1)

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t llm-guardrail-api:ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t llm-guardrail-web:ci .
