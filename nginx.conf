server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # ── Redirect to HTTPS ────────────────────────────────────────────────
    # Uncomment after setting up Let's Encrypt:
    # return 301 https://$host$request_uri;

    # ── Security headers ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.clerk.com https://*.clerk.accounts.dev https://us.i.posthog.com https://*.sentry.io; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://clerk.accounts.dev; frame-src 'self' https://clerk.accounts.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ── Rate limiting zones ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Block dotfiles ────────────────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ── Static frontend ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # ── Block access to index.html source map comments ───────────────────
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter '</head>' '<meta name="referrer" content="no-referrer"></head>';
        sub_filter_once on;
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    location ~ ^/(auth|api-keys|admin|chat|analytics|billing|policy|skills|health|vector|docs|redoc|openapi.json)(/.*)?$ {
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        limit_req zone=api burst=50 nodelay;

        if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }
    }

    # ── Clerk webhook (exempt from burst limits) ─────────────────────────
    location = /auth/clerk-webhook {
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Deny access to sensitive paths ────────────────────────────────────
    location ~ /\.(env|git|htaccess|htpasswd) {
        deny all;
        return 404;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
