limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=auth_strict:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;

    client_max_body_size 1m;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    send_timeout 10s;
    keepalive_timeout 65;
    reset_timedout_connection on;

    # ── Redirect to HTTPS ────────────────────────────────────────────────
    # Uncomment after setting up Let's Encrypt (certbot --nginx) or mounting
    # /etc/nginx/certs/fullchain.pem + privkey.pem and switching to 443:
    # return 301 https://$host$request_uri;
    # For TLS, change to: listen 443 ssl http2; ssl_certificate /etc/nginx/certs/fullchain.pem; ...

    # ── Security headers (OWASP 2026) ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.clerk.com https://*.clerk.accounts.dev https://us.i.posthog.com https://*.sentry.io; img-src 'self' data: https://img.clerk.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' https://clerk.accounts.dev; frame-src 'self' https://clerk.accounts.dev; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ── Block dotfiles / sensitive paths ─────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~ /\.(env|git|htaccess|htpasswd|bak|backup|old|swp|sql|dump) {
        deny all;
        return 404;
    }
    location ~* \.(bak|old|backup|swp|sql|dump)$ {
        deny all;
        return 404;
    }

    # ── Static frontend ──────────────────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600, immutable";
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 20;
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        sub_filter '</head>' '<meta name="referrer" content="no-referrer"></head>';
        sub_filter_once on;
    }

    # ── API proxy ────────────────────────────────────────────────────────
    location ~ ^/(auth|api-keys|admin|chat|analytics|billing|policy|skills|health|vector|memories|docs|redoc|openapi.json)(/.*)?$ {
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 30;
        if ($request_method !~ ^(GET|POST|HEAD|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }
        proxy_hide_header X-Powered-By;
    }

    # ── Auth endpoints — tighter (credential stuffing) ───────────────────
    location ~ ^/auth/(login|signup|clerk-webhook) {
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        limit_req zone=login burst=5 nodelay;
        limit_req zone=auth_strict burst=10 nodelay;
        limit_conn addr 10;
        if ($request_method !~ ^(GET|POST|OPTIONS)$) { return 405; }
    }
    location = /auth/clerk-webhook {
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Admin — optionally restrict by IP (uncomment) ────────────────────
    # location ~ ^/admin {
    #     allow 203.0.113.42;
    #     deny all;
    #     set $api_upstream http://api:8000;
    #     proxy_pass http://api:8000;
    # }

    # ── Live feed websocket ──────────────────────────────────────────────
    location ~ ^/live-feed/ {
        set $feed_upstream http://elixir_feed:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        limit_conn addr 20;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
    location = /health {
        access_log off;
        set $api_upstream http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://api:8000;
    }
}
