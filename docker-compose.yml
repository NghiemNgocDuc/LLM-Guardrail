services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  opa:
    # Policy engine for org custom Rego rules (OrgPolicy.custom_rule_rego).
    # Reachable ONLY on the internal Docker network — no published ports, so
    # it is not reachable from the public internet or from Nginx hosts.
    image: openpolicyagent/opa:1.18.2
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-level=error
    expose:
      - "8181"
    healthcheck:
      # Shell-free probe (the opa image has no shell); verifies the engine boots.
      test: ["CMD", "opa", "eval", "1 == 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  api:
    build: .
    restart: unless-stopped
    expose:
      - "8000"
    env_file: .env
    environment:
      DATABASE_URL: ""
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      APP_ENV: production
      DEBUG: "false"
      RATE_LIMIT_REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        # service_started, NOT service_healthy: the API must boot even if the
        # sidecar is down so requests can fail CLOSED per policy instead of
        # the whole API being unreachable.
        condition: service_started
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges:true

  elixir_feed:
    # Live request feed (pg_notify -> Phoenix channels, see elixir/live_feed).
    # Not exposed to the public: nginx proxies the /live-feed/ websocket here.
    build:
      context: elixir/live_feed
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      FEED_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-postgres}
      FEED_CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      FEED_CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      FEED_SECRET_KEY: ${SECRET_KEY:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      PHX_HOST: ${PHX_HOST:-localhost}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  grpc:
    # gRPC input-guard service (grpc_gateway/) — same InputGuardrail engine
    # as /chat on its own port/service. Internal network only; not published.
    build: .
    restart: unless-stopped
    command: ["python", "-m", "grpc_gateway.server"]
    expose:
      - "50051"
    environment:
      DATABASE_URL: ""
      APP_ENV: production
      DEBUG: "false"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

networks:
  internal:
    driver: bridge
    internal: false

volumes:
  pgdata:
  redisdata:
